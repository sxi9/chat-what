[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-jobbot"
version = "0.1.0"
description = "Deterministic WhatsApp chatbot for job alerts, recommendations and application status, with its own backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobbot = "jobbot.cli:main"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
